<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lulu, live watercolour</title>
<style>
  :root { --base: #191724; --surface: #1f1d2e; --overlay: #26233a; --muted: #908caa; --text: #e0def4; --foam: #9ccfd8; --rose: #ebbcba; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--base); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  h1 { font-size: 16px; margin: 0 0 10px; color: var(--rose); }
  canvas { display: block; width: 100%; max-width: 1000px; height: auto; border-radius: 6px; background: #faf4ed; }
  .row { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin: 10px 0; }
  label { display: flex; align-items: center; gap: 6px; }
  label span.value { color: var(--foam); min-width: 2.5em; text-align: right; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 150px; accent-color: var(--foam); }
  button { font: inherit; color: var(--text); background: var(--overlay); border: 1px solid var(--muted); border-radius: 4px; padding: 4px 10px; cursor: pointer; }
  #message { color: var(--rose); min-height: 1.4em; }
  #fps { color: var(--muted); }
</style>
</head>
<body>
<h1>Lulu, live watercolour</h1>
<canvas id="picture" width="1000" height="700"></canvas>
<div class="row">
  <button id="view-top">Top view</button>
  <button id="view-angle">From an angle</button>
  <button id="view-side">Side view</button>
  <button id="play">Pause</button>
  <span id="fps"></span>
</div>
<div class="row">
  <label>View tilt <input id="tilt" type="range" min="0" max="90" step="1" value="0"><span class="value" id="tilt-value"></span></label>
  <label>Spin <input id="spin" type="range" min="-180" max="180" step="1" value="0"><span class="value" id="spin-value"></span></label>
</div>
<div class="row">
  <label>Tail wiggle <input id="wiggle" type="range" min="0" max="60" step="1" value="0"><span class="value" id="wiggle-value"></span></label>
  <label>Colour flow <input id="flow" type="range" min="0" max="2" step="0.1" value="1"><span class="value" id="flow-value"></span></label>
</div>
<div id="message">Loading…</div>
<script type="module" src="dist/live.js"></script>
</body>
</html>
