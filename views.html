<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lulu Pixel Editor</title>
<style>
  :root { --base: #191724; --surface: #1f1d2e; --overlay: #26233a; --muted: #6e6a86; --text: #e0def4; --foam: #9ccfd8; --rose: #ebbcba; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--base); color: var(--text); font: 14px/1.4 ui-monospace, Menlo, monospace; }
  h1 { font-size: 16px; margin: 0 0 4px; color: var(--rose); }
  p { margin: 0 0 12px; color: var(--muted); }
  .views { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-start; }
  .view h2 { font-size: 13px; margin: 0 0 4px; color: var(--muted); font-weight: normal; }
  canvas { image-rendering: pixelated; border-radius: 4px; max-width: 100%; cursor: crosshair; }
  .panel { background: var(--surface); border: 1px solid var(--overlay); border-radius: 8px; padding: 12px; margin-top: 14px; display: flex; gap: 24px; flex-wrap: wrap; }
  .panel h3 { font-size: 13px; margin: 0 0 6px; color: var(--muted); font-weight: normal; }
  button { font: inherit; color: var(--text); background: var(--overlay); border: 1px solid var(--muted); border-radius: 4px; padding: 4px 10px; cursor: pointer; margin: 0 6px 6px 0; }
  .tools { display: flex; flex-wrap: wrap; gap: 4px; max-width: 520px; }
  .tool { display: flex; align-items: center; gap: 8px; margin: 0; }
  .tool.on { border-color: var(--foam); box-shadow: 0 0 0 1px var(--foam); }
  .sw { width: 16px; height: 16px; border-radius: 3px; border: 1px solid #0008; flex: none; }
  .sw.erase { background: repeating-conic-gradient(#888 0 25%, #ccc 0 50%) 0 0 / 8px 8px; }
  .sw.mark { background: transparent; border: 2px solid #00e5ff; }
  .previews { display: flex; gap: 8px; align-items: flex-end; }
  #list { white-space: pre-wrap; color: var(--foam); font-size: 12px; max-height: 240px; overflow: auto; }
</style>
</head>
<body>
<h1>Lulu pixel editor</h1>
<p>Paint with a colour, or Mark to point. Grids can be any width; the brighter lines every 4 pixels line up across all of them. Claude reads the result from this page.</p>
<div class="views" id="views"></div>
<div class="panel">
  <div>
    <h3>Tool</h3>
    <div class="tools" id="tools"></div>
    <h3 style="margin-top:12px">Page</h3>
    <button id="reset">Undo all changes</button>
    <button id="bg">Light background</button>
    <button id="centerGuide">Show center line</button>
    <button id="columnGuide" hidden>Show column guide</button>
    <button id="refOutline" hidden>Show reference outline</button>
  </div>
  <div>
    <h3>Actual size</h3>
    <div class="previews" id="previews"></div>
  </div>
  <div>
    <h3>Changed or marked pixels</h3>
    <div id="list">none</div>
  </div>
</div>
<script>
const SCALE = 12;
const params = new URLSearchParams(location.search);
const DEFAULT_VIEWS = [['front', 'views/front.txt'], ['side', 'views/side.txt'], ['back', 'views/back.txt']];
const VIEWS = params.get('views')?.split(',').map(p => p.split(':')) ?? DEFAULT_VIEWS;
// ?columns=view:12+17,other:14+19 marks those columns on those views, e.g. which legs are lifted in each frame
const COLUMNS = Object.fromEntries((params.get('columns') ?? '').split(',').filter(Boolean).map(p => { const [v, xs] = p.split(':'); return [v, xs.split(/[+ ]/).map(Number)]; }));
// ?outline=path/to/grid.txt shows that grid's outline pixels over every view; path/to/grid.txt@16 shifts it 16 columns right
const [OUTLINE_FILE, OUTLINE_SHIFT = '0'] = (params.get('outline') ?? '').split('@');
let refOutlineRows = null;
const NAMES = { o: 'outline', s: 'skin shadow', b: 'skin', g: 'gill', G: 'gill shadow', w: 'eye shine', e: 'eye' };
let palette = {}, light = false, tool = 'mark', painting = null, centerGuide = false, columnGuide = false, refOutline = false;
const original = {};
window.views = {};   // current pixel rows per view, including painted changes
window.marks = {};   // marked pixels per view
window.changes = () => Object.fromEntries(Object.keys(window.views).map(v => [v,
  window.views[v].flatMap((row, y) => row.flatMap((ch, x) => ch !== original[v][y][x] ? [[x, y, ch]] : []))]));
const size = v => ({ w: window.views[v][0].length, h: window.views[v].length });

const canvases = {}, previews = {};
const draw = () => {
  for (const [v] of VIEWS) {
    const c = canvases[v], ctx = c.getContext('2d'), grid = window.views[v], { w, h } = size(v);
    ctx.fillStyle = light ? '#f2e9e1' : '#191724';
    ctx.fillRect(0, 0, c.width, c.height);
    grid.forEach((row, y) => row.forEach((ch, x) => { if (ch !== '.') { ctx.fillStyle = palette[ch]; ctx.fillRect(x * SCALE, y * SCALE, SCALE, SCALE); } }));
    const lines = step => {
      for (let i = 0; i <= w; i += step) { ctx.beginPath(); ctx.moveTo(i * SCALE + 0.5, 0); ctx.lineTo(i * SCALE + 0.5, h * SCALE); ctx.stroke(); }
      for (let i = 0; i <= h; i += step) { ctx.beginPath(); ctx.moveTo(0, i * SCALE + 0.5); ctx.lineTo(w * SCALE, i * SCALE + 0.5); ctx.stroke(); }
    };
    ctx.lineWidth = 1;
    ctx.strokeStyle = light ? 'rgba(0,0,0,0.12)' : 'rgba(255,255,255,0.08)'; lines(1);
    ctx.strokeStyle = light ? 'rgba(0,0,0,0.3)' : 'rgba(255,255,255,0.22)'; lines(4);   // every 4 rows and columns
    if (centerGuide) {   // the grid's centre line
      ctx.save(); ctx.strokeStyle = '#c4a7e7'; ctx.lineWidth = 2; ctx.setLineDash([6, 4]);
      ctx.beginPath(); ctx.moveTo(w / 2 * SCALE, 0); ctx.lineTo(w / 2 * SCALE, h * SCALE); ctx.stroke(); ctx.restore();
    }
    if (refOutline && refOutlineRows) {
      ctx.save(); ctx.strokeStyle = '#f6c177'; ctx.lineWidth = 2;
      refOutlineRows.forEach((row, y) => [...row].forEach((ch, x) => { if (ch === 'o') ctx.strokeRect((x + +OUTLINE_SHIFT) * SCALE + 3, y * SCALE + 3, SCALE - 6, SCALE - 6); }));
      ctx.restore();
    }
    if (columnGuide && COLUMNS[v]) {
      ctx.save(); ctx.fillStyle = 'rgba(156, 207, 216, 0.3)'; ctx.strokeStyle = '#9ccfd8'; ctx.lineWidth = 2;
      for (const x of COLUMNS[v]) { ctx.fillRect(x * SCALE, 0, SCALE, h * SCALE); ctx.strokeRect(x * SCALE + 1, 1, SCALE - 2, h * SCALE - 2); }
      ctx.restore();
    }
    ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 2;
    for (const [x, y] of window.marks[v]) ctx.strokeRect(x * SCALE + 2, y * SCALE + 2, SCALE - 4, SCALE - 4);
    const p = previews[v].getContext('2d');
    p.fillStyle = light ? '#f2e9e1' : '#191724'; p.fillRect(0, 0, w, h);
    grid.forEach((row, y) => row.forEach((ch, x) => { if (ch !== '.') { p.fillStyle = palette[ch]; p.fillRect(x, y, 1, 1); } }));
  }
  const ch = window.changes();
  const lines = VIEWS.flatMap(([v]) => [
    ...ch[v].map(([x, y, c]) => `${v} (${x}, ${y}) → ${c === '.' ? 'empty' : NAMES[c] ?? palette[c]}`),
    ...window.marks[v].map(([x, y]) => `${v} (${x}, ${y}) marked`),
  ]);
  document.getElementById('list').textContent = lines.length ? lines.join('\n') : 'none';
};

const cellAt = (v, c, e) => { const r = c.getBoundingClientRect(), { w, h } = size(v); return [Math.floor((e.clientX - r.left) / r.width * w), Math.floor((e.clientY - r.top) / r.height * h)]; };
const apply = (v, [x, y], toggle) => {
  const { w, h } = size(v);
  if (x < 0 || y < 0 || x >= w || y >= h) return;
  if (tool === 'mark') {
    if (!toggle) return;
    const m = window.marks[v], i = m.findIndex(([mx, my]) => mx === x && my === y);
    if (i >= 0) m.splice(i, 1); else m.push([x, y]);
  } else window.views[v][y][x] = tool;
  draw();
};

const toolsEl = document.getElementById('tools');
const setTool = t => { tool = t; toolsEl.querySelectorAll('.tool').forEach(b => b.classList.toggle('on', b.dataset.t === t)); };
const addTool = (t, label, swClass, colour) => {
  const b = document.createElement('button'); b.className = 'tool'; b.dataset.t = t;
  const sw = document.createElement('span'); sw.className = 'sw ' + swClass; if (colour) sw.style.background = colour;
  b.append(sw, label); b.onclick = () => setTool(t); toolsEl.appendChild(b);
};
const toggle = (id, show, hide, flip) => { document.getElementById(id).onclick = e => { const on = flip(); e.target.textContent = on ? hide : show; draw(); }; };
document.getElementById('reset').onclick = () => { for (const [v] of VIEWS) { window.views[v] = original[v].map(r => [...r]); window.marks[v] = []; } draw(); };
toggle('bg', 'Light background', 'Dark background', () => (light = !light));
toggle('centerGuide', 'Show center line', 'Hide center line', () => (centerGuide = !centerGuide));
toggle('columnGuide', 'Show column guide', 'Hide column guide', () => (columnGuide = !columnGuide));
toggle('refOutline', 'Show reference outline', 'Hide reference outline', () => (refOutline = !refOutline));
document.getElementById('columnGuide').hidden = !Object.keys(COLUMNS).length;
if (OUTLINE_FILE) fetch(OUTLINE_FILE, { cache: 'no-store' }).then(r => r.text()).then(t => { refOutlineRows = t.split('\n').filter(l => l && !/^\S=#/.test(l)); document.getElementById('refOutline').hidden = false; });

const parse = text => {
  const rows = [];
  for (const line of text.split('\n').filter(Boolean)) {
    const m = line.match(/^(\S)=(#[0-9a-fA-F]{6})$/);
    if (m) palette[m[1]] = palette[m[1]] ?? m[2]; else rows.push(line.split(''));
  }
  return rows;
};

Promise.all(VIEWS.map(([, f]) => fetch(f, { cache: 'no-store' }).then(r => r.text()))).then(texts => {
  VIEWS.forEach(([v], i) => {
    original[v] = parse(texts[i]);
    window.views[v] = original[v].map(r => [...r]);
    window.marks[v] = [];
    const { w, h } = size(v);
    const wrap = document.createElement('div'); wrap.className = 'view';
    const title = document.createElement('h2'); title.textContent = v;
    const c = document.createElement('canvas'); c.width = w * SCALE; c.height = h * SCALE;
    c.addEventListener('pointerdown', e => { painting = v; c.setPointerCapture(e.pointerId); apply(v, cellAt(v, c, e), true); });
    c.addEventListener('pointermove', e => { if (painting === v && tool !== 'mark') apply(v, cellAt(v, c, e), false); });
    c.addEventListener('pointerup', () => { painting = null; });
    wrap.append(title, c); document.getElementById('views').appendChild(wrap); canvases[v] = c;
    const p = document.createElement('canvas'); p.width = w; p.height = h; p.style.width = w * 2 + 'px'; p.style.height = h * 2 + 'px';
    document.getElementById('previews').appendChild(p); previews[v] = p;
  });
  // one swatch per colour: letters that share a colour (eye = outline) get a single tool
  addTool('mark', 'Mark', 'mark');
  const seen = new Set();
  for (const [k, name] of Object.entries(NAMES)) {
    if (!palette[k] || seen.has(palette[k])) continue;
    seen.add(palette[k]);
    addTool(k, name, '', palette[k]);
  }
  // colours in the loaded files that have no name above get a tool labelled with their colour
  for (const [k, colour] of Object.entries(palette)) {
    if (k in NAMES || seen.has(colour)) continue;
    seen.add(colour);
    addTool(k, colour, '', colour);
  }
  addTool('.', 'Erase', 'erase');
  setTool('mark');
  draw();
});
</script>
</body>
</html>
