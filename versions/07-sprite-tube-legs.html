<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lulu Pixel Lab</title>
<style>
  :root { --base: #191724; --surface: #1f1d2e; --overlay: #26233a; --muted: #6e6a86; --text: #e0def4; --rose: #ebbcba; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px; background: var(--base); color: var(--text); font: 14px/1.4 ui-monospace, Menlo, monospace; }
  h1 { font-size: 18px; margin: 0 0 4px; color: var(--rose); }
  p.note { margin: 0 0 20px; color: var(--muted); }
  .controls { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
  .grid { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
  .card { background: var(--surface); border: 1px solid var(--overlay); border-radius: 8px; padding: 12px; max-width: 100%; }
  .card h2 { font-size: 14px; margin: 0 0 8px; }
  .stage { background: var(--overlay); display: grid; place-items: center; border-radius: 4px; width: 384px; height: 384px; max-width: 100%; }
  .stage.light, .light .stage-mini { background: #faf4ed; }
  canvas { image-rendering: pixelated; display: block; }
  #big { width: 384px; height: 384px; max-width: 100%; }
  .row { display: flex; gap: 8px; align-items: flex-end; margin-top: 8px; flex-wrap: wrap; }
  .frames canvas { border: 1px dashed var(--muted); width: 128px; height: 128px; }
  button, label { font: inherit; color: var(--text); }
  button { background: var(--overlay); border: 1px solid var(--muted); border-radius: 4px; padding: 4px 10px; cursor: pointer; }
  .palette { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .swatch { width: 20px; height: 20px; border-radius: 3px; border: 1px solid #0006; }
  .variant { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px; }
  .variant canvas { width: 192px; height: 192px; background: var(--overlay); }
  .variant canvas.light { background: #faf4ed; }
  .variant.on { border-color: var(--rose); }
  #variants { margin-bottom: 20px; }
  img.ref { width: 240px; max-width: 100%; display: block; }
</style>
</head>
<body>
<h1>Lulu pixel lab</h1>
<p class="note">64 × 64. Lulu at her telescope, like the painting.</p>


<div class="controls">
  <label><input type="checkbox" id="light"> light background</label>
</div>

<div class="grid">
  <div class="card">
    <h2>game sprite, 32 × 32</h2>
    <div class="stage"><canvas id="bigS" style="width:384px;height:384px;max-width:100%"></canvas></div>
    <div class="row"><span>1×</span><canvas id="oneS"></canvas><span>2×</span><canvas id="twoS" style="width:64px;height:64px"></canvas><span>4×</span><canvas id="fourS" style="width:128px;height:128px"></canvas></div>
  </div>
  <div class="card">
    <h2 id="which">idle</h2>
    <div class="stage" id="stage"><canvas id="big"></canvas></div>
    <div class="row"><span>1×</span><canvas id="one"></canvas><span>2×</span><canvas id="two" style="width:128px;height:128px"></canvas>
</div>
  </div>
  <div class="card">
    <h2>head on</h2>
    <div class="stage"><canvas id="bigF" style="width:384px;height:384px;max-width:100%"></canvas></div>
    <div class="row"><span>1×</span><canvas id="oneF"></canvas><span>2×</span><canvas id="twoF" style="width:128px;height:128px"></canvas></div>
  </div>
  <div class="card">
    <h2>reference</h2>
    <img class="ref" src="reference.png" alt="the original painted Lulu">
    <div class="palette" id="palette"></div>
  </div>
</div>

<script>
const SIZE = 64;
const FRAMES = 1;   // stills only until the design is approved

// ---------- palette: 8 colours ----------
const C = {
  outline:   '#5e3249',
  shadow:    '#c48f98',
  base:      '#ebbcba',
  highlight: '#f6e0da',
  gill:      '#eb6f92',
  gillFar:   '#b4476c',
  eye:       '#191724',
  glint:     '#f6e0da',
  scope:     '#31748f',
  scopeLight:'#56949f',
  scopeDark: '#1f2f45',
  gold:      '#f6c177',
};

// ---------- signed distance helpers (pure; units are pixels) ----------
const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
const add = (a, b) => [a[0] + b[0], a[1] + b[1]];
const mul = (a, s) => [a[0] * s, a[1] * s];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1];
const len = a => Math.hypot(a[0], a[1]);
const norm = a => mul(a, 1 / (len(a) || 1));
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const rotAround = (p, o, ang) => {
  const s = Math.sin(ang), c = Math.cos(ang), d = sub(p, o);
  return [o[0] + d[0] * c - d[1] * s, o[1] + d[0] * s + d[1] * c];
};

// tapered capsule from a (radius ra) to b (radius rb)
const capsule = (a, b, ra, rb) => p => {
  const pa = sub(p, a), ba = sub(b, a);
  const h = clamp(dot(pa, ba) / dot(ba, ba), 0, 1);
  return len(sub(pa, mul(ba, h))) - (ra + (rb - ra) * h);
};
// chain of tapered capsules through points with radii
const chain = (pts, radii) => {
  const segs = pts.slice(1).map((b, i) => capsule(pts[i], b, radii[i], radii[i + 1]));
  return p => Math.min(...segs.map(s => s(p)));
};
const ellipse = (c, rx, ry) => p => {
  const d = sub(p, c);
  return (Math.hypot(d[0] / rx, d[1] / ry) - 1) * Math.min(rx, ry);
};
const smin = (k, ...fs) => p => fs.map(f => f(p)).reduce((a, b) => {
  const h = Math.max(k - Math.abs(a - b), 0) / k;
  return Math.min(a, b) - h * h * k / 4;
});
const union = (...fs) => p => Math.min(...fs.map(f => f(p)));

// ---------- the model: Lulu at her telescope, like the painting ----------
const VARIANTS = { SCOPE: { label: 'Lulu with telescope' } };

function lulu() {
  // body: big round head, pear-shaped belly, sitting back on its legs
  const head = smin(4, ellipse([30, 24], 11.5, 8.5), ellipse([32, 27.5], 9.5, 6));
  const torso = ellipse([27, 42], 9, 11);
  const tail = smin(3,
    chain([[20, 50], [10, 56], [2, 53]], [5.5, 3.5, 0.6]),
    chain([[16, 51], [8, 52], [2, 53]], [1, 2, 0.6]));
  const backLeg = union(ellipse([30, 50], 4.5, 4), capsule([31, 55], [35, 57], 2, 1.5));
  const body = union(smin(4, head, torso), smin(3, torso, tail), smin(2.5, torso, backLeg));

  // near arm reaching up to grip the tube, drawn in front with its own outline
  const arm = union(chain([[31, 37], [36, 36], [41, 31]], [2.6, 2.2, 2]), ellipse([42, 30.5], 2.1, 2.1));

  // far limbs behind the body
  const far = union(
    chain([[21, 50], [20, 54], [19, 57]], [3, 2.2, 1.8]), capsule([19, 57], [23, 57.5], 1.5, 1.1),
    chain([[27, 37], [33, 33], [40, 29]], [2, 1.8, 1.6]));

  // gills: soft rounded fronds at the back of the head
  const frond = (root, tip) => {
    const dir = norm(sub(tip, root)), n = [dir[1], -dir[0]];
    const length = len(sub(tip, root));
    const puffs = [0.55, 0.85].map(s => ellipse(add(add(root, mul(dir, s * length)), mul(n, 1.2)), 1.6, 1.6));
    return union(capsule(root, tip, 2.1, 1.7), ...puffs);
  };
  const gills = union(frond([24, 21], [16, 11]), frond([23, 25], [11, 22]), frond([24, 29], [14, 35]));
  const farGills = union(frond([26, 18], [21, 8]), frond([24, 19], [12, 14]));

  // eye placed pixel by pixel: a round 4x4 with a highlight at the top left
  const eyePx = new Set(['34,20', '35,20', '33,21', '34,21', '35,21', '36,21', '33,22', '34,22', '35,22', '36,22', '34,23', '35,23']);
  const glintPx = new Set(['34,21']);
  const mouth = chain([[41, 27.5], [37, 29.5], [33, 28.5]], [0.55, 0.55, 0.55]);

  // telescope: eyepiece at Lulu's eye, tube widening toward the sky, gold bands, three-legged stand
  const A = [42, 19], B = [60, 8];
  const band = (t, r) => {
    const p = add(A, mul(sub(B, A), t)), d = mul(norm(sub(B, A)), 0.6);
    return capsule(sub(p, d), add(p, d), r, r);
  };
  const tube = union(capsule(A, B, 2.6, 4.4), capsule([39, 20.5], A, 1.3, 1.3));
  const rings = union(band(0.12, 3.3), band(0.78, 4.9));
  const mount = ellipse([50, 17], 2.2, 2.5);
  const tripod = union(
    capsule([50, 18], [44, 57], 1, 1), capsule([50, 18], [56, 57], 1, 1), capsule([50, 18], [50.5, 55], 0.9, 0.9));

  return { body, head, arm, far, gills, farGills, eyePx, glintPx, mouth, tube, rings, mount, tripod };
}

// ---------- the same Lulu, facing the viewer ----------
function luluFront() {
  const none = () => Infinity;
  const mx = p => [64 - p[0], p[1]];
  const mirrored = g => p => g(mx(p));

  // body: same head, belly and leg sizes as the side view, seen from the front
  const head = smin(4, ellipse([32, 24], 13, 8.5), ellipse([32, 27.5], 12, 6));
  const torso = ellipse([32, 42], 9, 11);
  const foot = union(ellipse([27, 52], 4, 3.5), capsule([26.5, 55], [24, 57.5], 2, 1.5));
  const tail = smin(3,
    chain([[38, 51], [48, 56], [57, 53]], [5, 3.5, 0.6]),
    chain([[42, 52], [51, 52], [57, 53]], [1, 2, 0.6]));
  const body = union(smin(4, head, torso), smin(3, torso, foot, mirrored(foot)), smin(3, torso, tail));

  // arms resting at the sides, drawn in front with their own outline
  const armL = union(chain([[24.5, 36], [23, 41], [24, 45]], [2.6, 2.2, 2]), ellipse([24.5, 45.5], 2.1, 2.1));
  const arm = union(armL, mirrored(armL));

  // gills: same soft fronds, three per side, fanning out from behind the cheeks
  const frond = (root, tip) => {
    const dir = norm(sub(tip, root)), n = [dir[1], -dir[0]];
    const length = len(sub(tip, root));
    const puffs = [0.55, 0.85].map(s => ellipse(add(add(root, mul(dir, s * length)), mul(n, 1.2)), 1.6, 1.6));
    return union(capsule(root, tip, 2.1, 1.7), ...puffs);
  };
  const gillsL = union(frond([22, 20], [13, 11]), frond([21, 24], [9, 21]), frond([22, 28], [12, 33]));
  const backGills = union(gillsL, mirrored(gillsL));

  // eyes placed pixel by pixel: the same round 4x4 with a top-left highlight, wide-set
  const eyeAt = (x, y) => [[1, 0], [2, 0], [0, 1], [1, 1], [2, 1], [3, 1], [0, 2], [1, 2], [2, 2], [3, 2], [1, 3], [2, 3]]
    .map(([dx, dy]) => `${x + dx},${y + dy}`);
  const eyePx = new Set([...eyeAt(23, 20), ...eyeAt(37, 20)]);
  const glintPx = new Set(['24,21', '38,21']);
  const mouth = chain([[26, 29], [32, 31.5], [38, 29]], [0.55, 0.55, 0.55]);

  return { body, head, arm, far: none, gills: none, backGills, farGills: none, eyePx, glintPx, mouth,
           tube: none, rings: none, mount: none, tripod: none };
}

// ---------- rasteriser (pure: model -> array of colours) ----------
const LIGHT = norm([-0.45, -0.9]);
function rasterise(m) {
  const at = (i, j) => [i + 0.5, j + 0.5];
  // layer id per pixel, front to back
  const layer = p => {
    const key = `${Math.floor(p[0])},${Math.floor(p[1])}`;
    if (m.eyePx.has(key)) return m.glintPx.has(key) ? 'glint' : 'eye';
    if (m.mouth(p) <= 0 && m.head(p) <= -0.5) return 'mouth';
    if (m.arm(p) <= 0) return 'arm';
    if (m.gills(p) <= 0) return 'gill';
    if (m.body(p) <= 0) return 'body';
    if (m.backGills && m.backGills(p) <= 0) return 'gill';
    if (m.rings(p) <= 0) return 'ring';
    if (m.tube(p) <= 0) return 'tube';
    if (m.mount(p) <= 0 || m.tripod(p) <= 0) return 'tripod';
    if (m.far(p) <= 0) return 'far';
    if (m.farGills(p) <= 0) return 'farGill';
    return null;
  };
  const ids = [];
  for (let j = 0; j < SIZE; j++) for (let i = 0; i < SIZE; i++) ids.push(layer(at(i, j)));
  const id = (i, j) => (i < 0 || j < 0 || i >= SIZE || j >= SIZE) ? null : ids[j * SIZE + i];
  const N4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  const lulu = new Set(['body', 'eye', 'glint', 'mouth']);
  const tone = (sdf, p) =>
    sdf(add(p, mul(LIGHT, 2.2))) > 0 ? C.highlight : sdf(sub(p, mul(LIGHT, 3))) > 0 ? C.shadow : C.base;

  return ids.map((l, k) => {
    if (!l) return null;
    const i = k % SIZE, j = Math.floor(k / SIZE), p = at(i, j);
    const nbrs = N4.map(([di, dj]) => id(i + di, j + dj));
    switch (l) {
      case 'gill': return nbrs.some(n => n !== 'gill') ? C.gillFar : C.gill;
      case 'farGill': return C.gillFar;
      case 'far': return nbrs.some(n => n !== 'far') ? C.outline : C.shadow;
      case 'tripod': return C.scopeDark;
      case 'ring': return nbrs.some(n => n !== 'ring' && n !== 'tube') ? C.scopeDark : C.gold;
      case 'tube': return nbrs.some(n => n !== 'tube' && n !== 'ring') ? C.scopeDark
        : m.tube(add(p, mul(LIGHT, 1.6))) > 0 ? C.scopeLight : C.scope;
      case 'arm': return nbrs.some(n => n !== 'arm') ? C.outline : tone(m.arm, p);
    }
    if (nbrs.some(n => !lulu.has(n))) return C.outline;                          // silhouette outline
    if (l !== 'body') return C[l];
    return tone(m.body, p);
  });
}

// ---------- 32x32 game sprite, drawn pixel by pixel ----------
// Left half only (16 columns); the right half is its mirror image.
// . empty  o outline  h highlight  b base  s shadow  g gill  G gill outline  e eye  w eye highlight
const SPRITE_LEFT = [
  '................', // 0
  '................', // 1
  '.GG.............', // 2
  'GggG............', // 3
  'GgggG...........', // 4
  '.GgggG..........', // 5
  '..GgggG....ooooo', // 6
  '...GgggGooohhhhh', // 7
  '....Gggohhhhbbbb', // 8
  '.GG..Gobbbbbbbbb', // 9
  'GggGGobbbbbbbbbb', // 10
  'ggggGobbbwebbbbb', // 11
  'GGGGGobbbeebbbbb', // 12
  '.....obbbeebbbbb', // 13
  '.....obbbbbbbbbb', // 14
  '....Gobbbbbobbbb', // 15
  '...GgGsbbbbboooo', // 16
  '..GggGosssssssss', // 17
  '.GggG..ossssssss', // 18
  '.GgG....oooooooo', // 19
  '..G......ossssss', // 20
  '.......obbobbbbb', // 21
  '.......obbobbbbb', // 22
  '.......obbobbbbb', // 23
  '.......osbobbbbb', // 24
  '........ooobbbbb', // 25
  '.........osbbbbb', // 26
  '.........ossbbbb', // 27
  '........obbbbbos', // 28
  '........oooooo..', // 29
  '................', // 30
  '................', // 31
];
// The tail and the right eye's highlight break the symmetry: [row, column, letters]
const SPRITE_OVERLAY = [
  [11, 21, 'we'],
  [23, 28, 'ooo'],
  [24, 25, 'ooobbo'],
  [25, 24, 'obbbbbbo'],
  [26, 22, 'bbbbbbbo'],
  [27, 22, 'ssssssso'],
  [28, 24, 'oooooo'],
];
const SPRITE_COLOURS = {
  o: C.outline, h: C.highlight, b: C.base, s: C.shadow, g: C.gill, G: C.gillFar, e: C.eye, w: C.glint,
};
function spritePixels() {
  const rows = SPRITE_LEFT.map(r => (r + [...r].reverse().join('')).split(''));
  for (const [y, x, letters] of SPRITE_OVERLAY) [...letters].forEach((ch, k) => { rows[y][x + k] = ch; });
  return rows.flat().map(ch => SPRITE_COLOURS[ch] ?? null);
}

// ---------- page (side effects at the edge) ----------
const sheets = Object.fromEntries(Object.entries(VARIANTS).map(([k, v]) =>
  [k, Array.from({ length: FRAMES }, (_, f) => rasterise(lulu()))]));
let current = 'SCOPE';

function paint(canvas, pixels, ox = 0) {
  const ctx = canvas.getContext('2d');
  pixels.forEach((c, k) => { if (c) { ctx.fillStyle = c; ctx.fillRect(ox + k % SIZE, Math.floor(k / SIZE), 1, 1); } });
}
const fresh = (canvas, w = SIZE) => { canvas.width = w; canvas.height = SIZE; return canvas; };

const big = document.getElementById('big'), one = document.getElementById('one'), two = document.getElementById('two');
Object.values(C).forEach(c => { const s = document.createElement('span'); s.className = 'swatch'; s.style.background = c; s.title = c; document.getElementById('palette').appendChild(s); });

function render() {
  document.getElementById('which').textContent = VARIANTS[current].label;
  for (const c of [big, one, two]) paint(fresh(c), sheets[current][0]);
  const spritePx = spritePixels();
  for (const id of ['bigS', 'oneS', 'twoS', 'fourS']) {
    const c = document.getElementById(id); c.width = c.height = 32;
    const ctx = c.getContext('2d');
    spritePx.forEach((col, k) => { if (col) { ctx.fillStyle = col; ctx.fillRect(k % 32, Math.floor(k / 32), 1, 1); } });
  }
  const frontPx = rasterise(luluFront());
  for (const id of ['bigF', 'oneF', 'twoF']) paint(fresh(document.getElementById(id)), frontPx);
}
document.getElementById('light').onchange = e => document.querySelectorAll('.stage').forEach(x => x.classList.toggle('light', e.target.checked));
render();
</script>
</body>
</html>
